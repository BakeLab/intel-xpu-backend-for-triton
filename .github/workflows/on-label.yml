name: On label

permissions: read-all

on:
  pull_request:
    branches:
      - main
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ---- vLLM tests ----

  vllm-tests-bmg:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'run-vllm-tests')
    uses: ./.github/workflows/vllm-tests-reusable.yml
    with:
      runner_label: b60
      skip_list: xe2
    secrets: inherit

  sglang-tests-bmg:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'run-sglang-tests')
    uses: ./.github/workflows/sglang-tests-reusable.yml
    with:
      runner_label: b60
      skip_list: xe2
      install_sgl_kernel_xpu: true
    secrets: inherit
